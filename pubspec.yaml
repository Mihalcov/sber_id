name: sber_id_sdk
description: "Flutter plugin for Sber ID sign-in on iOS and Android. Support the project: https://messenger.sbrf.ru/sl/XMNhVd5RNSjvfnHRu"
version: 0.2.1
homepage: https://github.com/Mihalcov/sber_id
repository: https://github.com/Mihalcov/sber_id
issue_tracker: https://github.com/Mihalcov/sber_id/issues
topics:
  - authentication
  - oauth
  - sber

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.plugin.sber_id
        pluginClass: SberIdPlugin
      ios:
        pluginClass: SberIdPlugin
        swiftPackage: sber_id_sdk
