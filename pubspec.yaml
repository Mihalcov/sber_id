name: sber_id
description: "Flutter plugin for Sber ID authentication (SIDSDK on iOS, SIDSDK_CORE on Android)."
version: 0.0.1+1
homepage: https://github.com/Mihalcov/sber_id
repository: https://github.com/Mihalcov/sber_id

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.plugin.sber_id
        pluginClass: SberIdPlugin
      ios:
        pluginClass: SberIdPlugin
        swiftPackage: sber_id
